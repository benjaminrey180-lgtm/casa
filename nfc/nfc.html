<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="ION Group: desarrollo de sistemas, servicios y ecommerce.">
  <title>ION Group · NFC</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#101114;color:#f7f7f8}
    *{box-sizing:border-box}
    body{min-height:100svh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#292633 0%,#101114 58%)}
    main{width:min(100%,420px);padding:36px 26px 26px;border:1px solid #ffffff1c;border-radius:28px;background:#17181de8;box-shadow:0 24px 80px #0008;text-align:center}
    .logo{width:92px;height:92px;object-fit:cover;border-radius:23px;border:1px solid #ffffff24}
    .eyebrow{margin:25px 0 8px;color:#b9a4ff;font-size:11px;font-weight:750;letter-spacing:.18em}
    h1{margin:0;font-size:32px;letter-spacing:-.04em}
    .description{margin:14px auto 27px;max-width:300px;color:#b9bac4;line-height:1.6}
    .links{display:grid;gap:11px}
    .link{display:block;padding:15px 18px;border:1px solid #ffffff20;border-radius:14px;color:#fff;text-decoration:none;font-weight:650;background:#ffffff08}
    .link.primary{border-color:#a995ff;background:#8c73f2;color:#fff}
    footer{margin-top:25px;color:#777984;font-size:12px}
    @media(prefers-reduced-motion:no-preference){.link{transition:transform .18s,background .18s}.link:hover{transform:translateY(-2px);background:#ffffff13}.link.primary:hover{background:#9a85ff}}
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/assets/ion-group-logo.jpeg" alt="Logo de ION Group">
    <p class="eyebrow">TARJETA DIGITAL · NFC</p>
    <h1>ION Group</h1>
    <p class="description">Desarrollo de sistemas, servicios y ecommerce.</p>
    <nav class="links" aria-label="Enlaces de ION Group">
      <a class="link primary" href="https://iongroup.cl">Visitar iongroup.cl ↗</a>
      <a class="link" href="https://www.instagram.com/iongroup.cl/">Instagram · @iongroup.cl ↗</a>
    </nav>
    <footer>ION Group SpA</footer>
  </main>
</body>
</html>
